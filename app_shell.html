<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Training House Walk</title>
<style>
  /* r99b (2026-10-05, training_house/look/look_ui/NOTES.md): the same tokens, face and icons as the walk page (index.html), whose
     styles are mounted after these. The face itself (@font-face, Inter) comes with index.html's styles; mountPage points its url
     at the file map. Until it arrives the setup screen is drawn in the phone's own face. */
  :root {
    --hp-amber: #F2B134; --hp-amber-hi: #FFC857; --hp-ink: #17130A; --hp-amber-soft: rgba(242,177,52,.16);
    --glass: rgba(16,18,22,.80); --glass-strong: rgba(16,18,22,.92); --bg: #0C0E11; --solid: #14171B; --solid-2: #1A1E23;
    --fill: rgba(255,255,255,.07); --fill-hi: rgba(255,255,255,.13); --line: rgba(255,255,255,.10); --line-hi: rgba(255,255,255,.20);
    --text: #F5F2EB; --text-2: #BCC0C7; --text-3: #8B9098; --r: 14px; --r-sm: 10px;
    --shadow: 0 10px 30px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.25);
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    /* the icons the setup screen and the phone controls use (look_ui/skin/icons.py) */
    --i-arrow_r: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 12h14'/%3E%3Cpath d='m12 5 7 7-7 7'/%3E%3C/svg%3E");
    --i-bolt: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 2 3 14h9l-1 8 10-12h-9z'/%3E%3C/svg%3E");
    --i-check: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20 6 9 17l-5-5'/%3E%3C/svg%3E");
    --i-chev_d: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
    --i-chev_u: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m18 15-6-6-6 6'/%3E%3C/svg%3E");
    --i-duplex: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 17V7'/%3E%3Cpath d='m5 10 3-3 3 3'/%3E%3Cpath d='M16 17V7'/%3E%3Cpath d='m13 10 3-3 3 3'/%3E%3Crect x='3' y='17' width='18' height='4' rx='1'/%3E%3C/svg%3E");
    --i-house: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 10.5 12 3l9 7.5'/%3E%3Cpath d='M5 9.5V21h14V9.5'/%3E%3Cpath d='M10 21v-6h4v6'/%3E%3C/svg%3E");
    --i-lift: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 17V7'/%3E%3Cpath d='m7 11 5-5 5 5'/%3E%3Crect x='4' y='17' width='16' height='4' rx='1'/%3E%3C/svg%3E");
    --i-slab: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 10.5 12 3l9 7.5'/%3E%3Cpath d='M5 9.5V17h14V9.5'/%3E%3Cpath d='M2 17h20v4H2z'/%3E%3C/svg%3E");
    --i-tree: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 22v-5'/%3E%3Cpath d='M12 2 5.5 11H9l-4 6h14l-4-6h3.5z'/%3E%3C/svg%3E");
    --img-chev-grey: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B9098' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
    --img-drop-amber: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F2B134' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 2.7c3.6 4.3 6.2 7.7 6.2 11a6.2 6.2 0 0 1-12.4 0c0-3.3 2.6-6.7 6.2-11z'/%3E%3C/svg%3E");
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  /* phone controls, added only on a touch screen: the walk page itself has none */
  /* Round 60 (Jake, after the landscape mockup: "I think it's too much... the walk and turn in the bottom right corner, and the
     stand right above it, and then just have those controls across the top that pop up"): everything a thumb works to MOVE is in
     ONE corner and the rest of the picture is clear. That corner is bottom LEFT: built bottom right first, from what he said, and
     corrected the same day ("the navigation and the stand are on the right-hand side, not the left-hand side"). The walk page's
     Toolbox button and the meter's buttons have the bottom right.
     2026-10-05: one rail down the left edge, x 0 to 92: the menu button at its head, the eye slider, the walk slider at its foot;
     nothing else ever lives there. */
  /* Round 60 (Jake, once it was in his hand: "on the D-pad we just need forward and back, that's all we need, we don't need side
     to side... that'll make the D a little bit smaller, just have the slider say forward, back, and then we turn, which is nice
     and sensitive, with ourselves"). The round pad is a short upright slider that springs back to the middle: up walks forward,
     down walks back, the ends run. Turning and looking are a finger on the view and nothing else; two fingers pinch to zoom.
     Forward and back are chevrons now; the words stay in the page for a screen reader. */
  #stick { position: fixed; left: 14px; bottom: 12px; width: 64px; height: 120px; border-radius: 32px; z-index: 40; touch-action: none;
           background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: var(--shadow); }
  #knob { position: absolute; left: 12px; top: 39px; width: 40px; height: 40px; border-radius: 50%; pointer-events: none;
          background: var(--hp-amber); box-shadow: 0 0 0 4px rgba(242,177,52,.22), 0 2px 6px rgba(0,0,0,.4); }
  #stick span { position: absolute; left: 0; right: 0; height: 16px; text-align: center; font: 700 0/1 system-ui, sans-serif; color: rgba(255,255,255,.75);
                pointer-events: none; text-shadow: 0 1px 2px #000; }
  #stick span::before { content: ''; display: block; margin: 0 auto; width: 18px; height: 16px; background: var(--text-2); -webkit-mask: var(--i-chev_u) center / contain no-repeat; mask: var(--i-chev_u) center / contain no-repeat; }
  #stick span.b::before { -webkit-mask-image: var(--i-chev_d); mask-image: var(--i-chev_d); }
  #stick span.f { top: 7px; } #stick span.b { bottom: 7px; }
  /* the height slider does the Crouch button's job in the app */
  #crouch { display: none !important; }

  /* the setup screen: pick the house while it is being built behind it */
  #setup { position: fixed; inset: 0; z-index: 60; background: var(--bg); color: var(--text); overflow-y: auto;
           font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  #setup .wrap { max-width: 880px; margin: 0 auto; padding: 32px 24px 0; }
  #setup .wrap::before { content: 'Happy Pipes'; display: block; margin-bottom: 8px; padding-left: 22px; background: var(--img-drop-amber) left center / 16px 16px no-repeat; font: 600 12px/18px var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--hp-amber); }
  #setup h1 { margin: 0; font: 700 28px/1.15 var(--font); letter-spacing: -.02em; color: var(--text); }
  #setup .sub { margin: 6px 0 0; color: var(--text-2); font-size: 14px; }
  #setup .build { margin-top: 22px; background: var(--solid); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px;
                  display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  /* a spinner that turns into a tick at "House is ready" */
  #setup .build span { flex: 1 1 150px; display: flex; align-items: center; gap: 10px; color: var(--text-2); font: 500 14px/1.3 var(--font); }
  #setup .build span::before { content: ''; flex: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--fill-hi); border-top-color: var(--hp-amber); animation: hpspin .9s linear infinite; }
  #setup .build.ready span { color: var(--text); font-weight: 600; }
  #setup .build.ready span::before { border: 0; animation: none; background: var(--hp-amber); -webkit-mask: var(--i-check) center / 16px no-repeat; mask: var(--i-check) center / 16px no-repeat; width: 18px; height: 18px; }
  @keyframes hpspin { to { transform: rotate(360deg); } }
  /* Round 98: the house that builds itself, in place of the 6 px bar that slid on a timer. Line art in the app's own
     colours; every stroke draws itself as the real file it stands for arrives (see HB below). The small copy beside
     the enter note is a clone of the same drawing, so both follow the same variables, set on #setup. */
  #setup .hb { flex: 1 1 320px; width: 100%; max-height: 104px; display: block; stroke: #e2e8f0; }
  @media (min-height: 600px) { #setup .hb { max-height: 130px; } }
  @media (max-width: 560px) { #setup .build span { min-width: 0; } #setup .hb { max-height: 80px; } }
  #setup .hb * { vector-effect: non-scaling-stroke; }
  /* the stroke colour is set on the stage groups and inherited; a shape only says it has no fill */
  #setup .hb path, #setup .hb rect, #setup .hb circle { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #setup .hb .ghost { stroke: #2A3038; stroke-dasharray: 3 4; }
  /* a stroke draws itself along its length: pathLength is 1 on every stroke, so one dash covers the whole of it and the
     offset is how much is still undrawn. The elements of a stage draw in turn: element i of n */
  #setup .hb .s { stroke-dasharray: 1px 1px; stroke-dashoffset: clamp(0px, calc(1px - (var(--p) * var(--n, 1) - var(--i, 0)) * 1px), 1px); transition: stroke-dashoffset .25s linear; }
  #setup .hb .lot { --p: var(--lot, 0); stroke: #a3b0c2; }
  #setup .hb .fnd { --p: var(--fnd, 0); stroke: #a3b0c2; }
  #setup .hb .wal { --p: var(--wal, 0); }
  #setup .hb .rof { --p: var(--rof, 0); }
  #setup .hb .frm { --p: var(--frm, 0); stroke: #64748b; }
  #setup .hb .fur { --p: var(--fur, 0); stroke: #a3b0c2; }
  #setup .hb .sup { --p: var(--sup, 0); }
  #setup .hb .dwv { --p: var(--dwv, 0); stroke: #f8fafc; }
  #setup .hb .gas { --p: var(--gas, 0); stroke: #facc15; }
  #setup .hb .hvc { --p: var(--hvc, 0); stroke: #94a3b8; stroke-width: 2.4; }
  #setup .hb .cold { stroke: #60a5fa; } #setup .hb .hot { stroke: #f87171; }
  /* the two foundations, the two heater spots, the two furnace spots, the two sewers, the two gas services, the two water
     services: the picks on this screen show one of each pair, live */
  #setup .hb .house { transform: translateY(calc(var(--dy, 0) * 1px)); transition: transform .4s ease; }
  #setup .hb .onslab { opacity: var(--slab, 0); } #setup .hb .oncrawl { opacity: calc(1 - var(--slab, 0)); }
  #setup .hb .whattic { opacity: var(--wha, 0); } #setup .hb .whcloset { opacity: calc(1 - var(--wha, 0)); }
  #setup .hb .hvattic { opacity: var(--hva, 0); } #setup .hb .hvcloset { opacity: calc((1 - var(--hva, 0)) * (1 - var(--pack, 0))); }
  #setup .hb .onseptic { opacity: var(--septic, 0); } #setup .hb .oncity { opacity: calc(1 - var(--septic, 0)); }
  #setup .hb .onpropane { opacity: var(--propane, 0); } #setup .hb .onnatural { opacity: calc(1 - var(--propane, 0)); }
  #setup .hb .onwell { opacity: var(--well, 0); } #setup .hb .onmeter { opacity: calc(1 - var(--well, 0)); }
  #setup .hb .onpack { opacity: var(--pack, 0); } #setup .hb .nopack { opacity: calc(1 - var(--pack, 0)); }
  /* the equipment drops into place, one unit per model the house has placed */
  #setup .hb .eq { transition: transform .45s cubic-bezier(.2, 1.4, .4, 1), opacity .2s linear; transform: translateY(calc(-26px * (1 - var(--e)))); opacity: var(--e); }
  #setup .hb .eq1 { --e: var(--eq1, 0); } #setup .hb .eq2 { --e: var(--eq2, 0); } #setup .hb .eq3 { --e: var(--eq3, 0); } #setup .hb .eq4 { --e: var(--eq4, 0); }
  #setup .hb .eq.whattic { opacity: calc(var(--e) * var(--wha, 0)); } #setup .hb .eq.whcloset { opacity: calc(var(--e) * (1 - var(--wha, 0))); }
  #setup .hb .eq.hvattic { opacity: calc(var(--e) * var(--hva, 0)); } #setup .hb .eq.hvcloset { opacity: calc(var(--e) * (1 - var(--hva, 0)) * (1 - var(--pack, 0))); }
  #setup .hb .eq.onseptic { opacity: calc(var(--e) * var(--septic, 0)); } #setup .hb .eq.oncity { opacity: calc(var(--e) * (1 - var(--septic, 0))); }
  #setup .hb .eq.onpack { opacity: calc(var(--e) * var(--pack, 0)); } #setup .hb .eq.nopack { opacity: calc(var(--e) * (1 - var(--pack, 0))); }
  #setup .hb .eq.onpropane { opacity: calc(var(--e) * var(--propane, 0)); }
  /* the lights come on and the door opens: House is ready. The door leaf is there once the walls have reached it */
  #setup .hb .win { fill: #f5b62d; fill-opacity: calc(var(--lit, 0) * .9); transition: fill-opacity .6s ease .15s; }
  #setup .hb .glow { fill: #f5b62d; stroke: none; fill-opacity: calc(var(--lit, 0) * .16); transition: fill-opacity .8s ease .25s; }
  #setup .hb .door { fill: #f5b62d; stroke: #f5b62d; opacity: clamp(0, calc((var(--wal, 0) - .875) * 8), 1); transform-origin: 271px 62px;
                     transform: skewY(calc(var(--lit, 0) * -24deg)) scaleX(calc(1 - var(--lit, 0) * .58)); transition: transform .7s cubic-bezier(.3, 1.3, .5, 1) .1s, opacity .2s linear; }
  #setup .hb .porch { fill: #f5b62d; stroke: none; fill-opacity: var(--lit, 0); transition: fill-opacity .3s ease; }
  /* the small copy on the House layout screen, beside "Building the slab house...": thinner lines, the fine detail left out */
  #setup .hb.mini { display: none; flex: 0 0 auto; width: 200px; max-height: 40px; }
  #setup .hb.mini.on { display: block; }
  #setup .hb.mini path, #setup .hb.mini rect, #setup .hb.mini circle { stroke-width: 1.1; }
  #setup .hb.mini .frm, #setup .hb.mini .fur, #setup .hb.mini .glow { display: none; }
  /* someone who asked for less motion gets the same house in steps, nothing slides */
  @media (prefers-reduced-motion: reduce) { #setup .hb * { transition: none !important; } }
  /* the presets as cards, each with its icon, an amber ring on the picked one */
  #setup h2 { margin: 28px 0 10px; font: 600 11px/1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); }
  #setup .presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  #setup .presets button { position: relative; display: grid; grid-template-columns: 36px 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: start; padding: 14px 14px 14px 12px;
                           background: var(--solid); border: 1px solid var(--line); border-radius: var(--r); color: var(--text); font: 600 14px/1.3 var(--font); cursor: pointer; text-align: left; }
  #setup .presets button::before { content: ''; grid-row: 1 / span 2; width: 36px; height: 36px; border-radius: 10px; background: var(--fill); }
  #setup .presets button::after { content: ''; position: absolute; left: 21px; top: 23px; width: 18px; height: 18px; background: var(--text-2); -webkit-mask: var(--ic, var(--i-house)) center / contain no-repeat; mask: var(--ic, var(--i-house)) center / contain no-repeat; }
  #setup .presets button small { display: block; grid-column: 2; margin-top: 3px; color: var(--text-3); font: 400 12.5px/1.4 var(--font); }
  #setup .presets button:hover { border-color: var(--line-hi); background: var(--solid-2); }
  #setup .presets button.on { border-color: var(--hp-amber); background: var(--solid); box-shadow: 0 0 0 1px var(--hp-amber) inset; }
  #setup .presets button.on::before { background: var(--hp-amber-soft); }
  #setup .presets button.on::after { background: var(--hp-amber); }
  #setup .presets [data-id="country"] { --ic: var(--i-tree); } #setup .presets [data-id="slab"] { --ic: var(--i-slab); }
  #setup .presets [data-id="lift"] { --ic: var(--i-lift); } #setup .presets [data-id="duplex"] { --ic: var(--i-duplex); } #setup .presets [data-id="electric"] { --ic: var(--i-bolt); }
  /* the details as one ruled list, a chevron on each, styled selects */
  #setup details { margin-top: 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; }
  #setup #choices { border: 1px solid var(--line); border-radius: var(--r); background: var(--solid); overflow: hidden; }
  #setup #choices details:first-child { border-top: 0; }
  #setup summary { cursor: pointer; padding: 13px 16px; color: var(--text); list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; font: 600 14px/1.3 var(--font); }
  #setup summary::-webkit-details-marker { display: none; }
  #setup summary::after { content: ''; flex: none; width: 16px; height: 16px; background: var(--text-3); -webkit-mask: var(--i-chev_d) center / contain no-repeat; mask: var(--i-chev_d) center / contain no-repeat; transition: transform .15s; }
  #setup details[open] summary::after { transform: rotate(180deg); }
  #setup summary span { flex: none; }
  #setup summary em { flex: 1; color: var(--text-3); font: 400 12.5px/1.4 var(--font); text-align: right; }
  #setup details .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 16px; padding: 2px 16px 16px; }
  #setup label { display: block; color: var(--text-3); font: 500 12px/1.3 var(--font); }
  #setup select { width: 100%; margin-top: 6px; padding: 9px 34px 9px 10px; background: var(--fill) var(--img-chev-grey) right 10px center / 14px no-repeat; border: 1px solid var(--line); border-radius: var(--r-sm); color: var(--text); font: 500 13px var(--font);
                  -webkit-appearance: none; appearance: none; }
  #setup select:focus, #setup button:focus-visible { outline: 2px solid var(--hp-amber); outline-offset: 2px; }
  /* pinned to the bottom of the screen: sideways on a phone the button was a scroll away, under the details */
  #setup .go { margin-top: 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 14px; border-top: 1px solid var(--line); box-shadow: 0 -12px 24px rgba(12,14,17,.9); }
  #setup .go button { display: inline-flex; align-items: center; gap: 10px; padding: 0 22px; height: 48px; border: 0; border-radius: 12px; background: var(--hp-amber); color: var(--hp-ink); font: 700 15px/1 var(--font); box-shadow: 0 6px 18px rgba(242,177,52,.25); cursor: pointer; }
  #setup .go button::after { content: ''; width: 18px; height: 18px; background: currentColor; -webkit-mask: var(--i-arrow_r) center / contain no-repeat; mask: var(--i-arrow_r) center / contain no-repeat; }
  #setup .go button:hover:not(:disabled) { background: var(--hp-amber-hi); }
  #setup .go button:disabled { opacity: 1; cursor: default; background: var(--fill-hi); color: var(--text-3); box-shadow: none; }
  #setup .note { color: var(--text-3); font-size: 12.5px; }
  #setup #ver { margin: 10px 0 24px; font-size: 11.5px; }
  #setup .err { color: #fca5a5; }
  @media (max-height: 480px) {
    #setup .wrap { padding-top: 18px; padding-bottom: 8px; } #setup h1 { font-size: 22px; } #setup .build { margin-top: 14px; padding: 10px 14px; } #setup h2 { margin-top: 18px; }
    /* a phone sideways has no height for a bar along the bottom: Enter sits in the top right corner, beside the title, over nothing */
    #setup .go { position: fixed; top: 16px; right: max(20px, calc((100vw - 880px) / 2 + 24px)); bottom: auto; margin: 0; padding: 0; background: none; border: 0; box-shadow: none;
      flex-direction: column; align-items: flex-end; gap: 6px; max-width: 46vw; z-index: 2; }
    #setup .go button { height: 44px; }
    #setup .go .note { text-align: right; }
  }
  /* Show mode (2026-09-22): the "See it in 3D" link from Comms and the Home Portal opens the house already pointed at one thing.
     The setup screen is only its loading line, and the tools, the Keys, Layout and Add ons tabs and Fly are gone
     (Jake: "I've never used the fly, it goes"). The Views tab, the Layers tab, the stick, the eye slider and the gloves stay. */
  body.showmode #setup .wrap > :not(#build):not(#ver) { display: none; }
  body.showmode #setup .build { margin-top: 48px; }
  body.showmode #toolbox, body.showmode #toolboxmenu, body.showmode #fly,
  body.showmode [data-tab="keys"], body.showmode [data-tab="layout"], body.showmode [data-tab="addons"] { display: none !important; }
  /* Round 60: the eye height slider. Top is standing, bottom is crawling. 2026-10-05: in a glass capsule with Stand and Crawl
     inside it; on a computer it sits alone in the middle of the left edge, on a phone held sideways under the menu button
     (10 to 56) and over the walk slider (top at 100vh - 132) */
  #eyebar { position: fixed; left: 23px; top: 50%; bottom: auto; transform: translateY(-50%); width: 46px; height: 240px; z-index: 40;

            touch-action: none; user-select: none; -webkit-user-select: none; cursor: ns-resize; }
  @media (max-height: 480px) { #eyebar { top: 62px; transform: none; height: calc(100vh - 62px - 142px); min-height: 110px; } }
  /* the track stops 44 px short at each end: the knob is 36 px across and was parked on top of the word Stand (Jake: "I can't see the
     stand button"), so the two words get room of their own beyond the knob's travel */
  #eyebar .track { position: absolute; left: 50%; top: 44px; bottom: 44px; width: 4px; margin-left: -2px; border: 0; border-radius: 2px; background: var(--fill-hi); }
  #eyebar .fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 2px; background: var(--hp-amber); }

  @media (min-width: 921px) and (min-height: 481px) { #info { top: 52px !important; max-height: calc(100vh - 64px) !important; } }

<!-- the version tag makes a browser that cached an older shim fetch this one: a new page next to an old shim is what

     shim changes. -->
<script src="asset-shim.js?v=98a"></script>
<script>
// Round 59. The app runs Jake's walk page itself: the index.html and walk.js he uploads next to the models, unchanged.
// Every rule built into it over the rounds (door swing sides, riser lids, clips, the fixture lights, the work views) comes
// with it, because it is the same code. This page does only what the walk page cannot do for itself inside the app:
//   1. waits for the app to hand over the file map (name -> uploaded URL), which asset-shim.js resolves every load against
//   2. puts the uploaded index.html's styles and markup in place, then runs the uploaded walk.js
//   3. the setup screen (Jake: "a loading screen... a screen where they select what type of house before they go into
//      it... presets... that gives us time to load while they're sitting there selecting"). The house is built behind
//      it from the moment the page opens, and it is built in the layout it will be entered in: the starting layout is
//      handed to walk.js before it runs, so nothing has to be rebuilt on the way in unless the details are changed.
//   4. the gloved hands, hung on the walk page's camera
//   5. on a phone, a thumb stick and touch look, which the walk page does not have
// To update the house after a round: upload the new walk.js and index.html on the Assets page. Nothing here changes.
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var setupEl = $('setup');
  function say(t, err) { $('bstatus').textContent = t; $('bstatus').className = err ? 'err' : ''; }

  // The app's house, which is not quite the walk page's own starting layout. Jake, 2026-09-19: "city sewer gravity as
  // default, and water softener no as default". Everything not named here is the walk page's own default.
  var APP_DEFAULTS = { sewer: 'city_gravity', softener: 'no' };

  function text(url) {
    return window.__realFetch(url).then(function (r) {
      if (!r.ok) throw new Error(r.status + ' for ' + url);
      return r.text();
    });
  }

  // the walk page's own look and markup, without its script tags: this page loads the scripts itself, in order
  // Which build is this phone running? Jake saw the stick on the right a day after the left hand version was published: a
  // tab left open keeps the old page, and nothing on screen said so. SHELL is bumped by hand with every change to this file;
  // the house version is read off the uploaded index.html's own walk.js tag.
  var SHELL = '99b';
  function showVersion(html) {
    var m = /<script src="walk\.js\?(r\w+)"/.exec(html || '');     // the tag itself: the page's comments mention walk.js?rNN too
    $('ver').textContent = 'app ' + SHELL + ' · house ' + (m ? m[1] : 'unknown') + ' · ' + (window.__HOUSE_SOURCE || 'files from the Assets page');
  }
  function mountPage(html) {
    showVersion(html);
    var doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('head style, head link[rel="stylesheet"]').forEach(function (n) {
      var c = document.importNode(n, true);
      // r99b: the walk page names its font file beside itself, url('inter-latin.woff2'). This page is a blob with no folder, so the
      // name is looked up in the file map like every other file; not in the map, the url stays and the phone's own face is used.
      if (c.tagName === 'STYLE') c.textContent = c.textContent.replace(/url\((['"]?)([\w.-]+\.woff2)\1\)/g, function (m, q, f) {
        var u = (window.__ASSETS || {})[f]; return u ? 'url("' + u + '")' : m;

  // Two small additions to the walk page's text as it is loaded; walk.js itself is not edited.
  //   After `const CONFIG = {...};`: remember the walk page's own defaults, then apply the starting layout, so the house
  //   is BUILT in it rather than built one way and rebuilt on the way in.
  //   After `window.walk = {`: CONFIG, CONFIG_CHOICES and reconfigure, so the details can be changed through the walk
  //   page's own layout switch, the same one its Layers tab uses.
  // If either anchor ever changes, that part simply does not happen and the house opens as the walk page builds it.
  function expose(code) {
    var out = { code: code, ok: false };
    var c0 = code.indexOf('const CONFIG = {');
    var c1 = c0 < 0 ? -1 : code.indexOf('};', c0);
    if (c1 > 0) {
      c1 += 2;
      out.code = out.code.slice(0, c1) + ' window.__walkBase = Object.assign({}, CONFIG); Object.assign(CONFIG, window.__WALK_START || {});' + out.code.slice(c1);
    }
    var at = out.code.indexOf('window.walk = {');
    if (at >= 0) {
      var cut = at + 'window.walk = {'.length;
      out.code = out.code.slice(0, cut) + ' CONFIG, CONFIG_CHOICES, reconfigure,' + out.code.slice(cut);
      out.ok = true;
    }
    return out;
  }

  // Run walk.js from its text. An uploaded file is served as application/octet-stream, and a browser with strict MIME
  // checking refuses to execute that from a script tag; a blob typed as JavaScript it runs.
  function runScript(code) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
      s.onload = res;
      s.onerror = function () { rej(new Error('walk.js failed to run')); };
      document.body.appendChild(s);
    });
  }

  function start(map, show) {
    if (window.__ASSETS) return;
    window.__ASSETS = map;
    HB.sizes(map);
    // Show mode: the parent named one thing to land on. The setup screen is never seen, the job's layout is built, and
    // nothing about it is remembered (Jake, 2026-09-22: the job's layout is not the person's training pick, and a
    // homeowner's guess is not a fact). An open with no start behaves as it always has.
    SHOW = (show && show.mode === 'show') ? show : null;
    if (SHOW) document.body.classList.add('showmode');
    window.__patchWalkLoader();
    if (!map['walk.js'] || !map['index.html']) {
      say('The walk page files are not uploaded yet. On the Assets page, upload walk.js and index.html from ' +
          'equipment-models\\electric_tank_water_heater\\viewer\\house', true);
      return;
    }
    // build in the last layout this person entered, or the app's default house
    var last = remembered();
    window.__WALK_START = Object.assign({}, APP_DEFAULTS, (last && last.set) || {}, (SHOW && SHOW.set) || {});
    text(map['index.html'])
      .then(function (html) { mountPage(html); return text(map['walk.js']); })
      .then(function (code) { var x = expose(code); canSet = x.ok; return runScript(x.code); })
      .then(function () { buildChoices(); watch(); })
      .catch(function (e) { say('Could not start the house: ' + e.message, true); });
  }

  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    if (e.data && e.data.type === 'house-assets') { window.__HOUSE_SOURCE = e.data.source || ''; start(e.data.map, e.data.start); }
  });
  if (window.parent !== window) window.parent.postMessage({ type: 'house-ready' }, location.origin);
  else say('Open this from the app, which hands it the uploaded files.', true);

  // ------------------------------------------------------------------ the house that builds itself (round 98)
  // The 6 px bar slid on a timer and said nothing. This draws the house the way the real one arrives: the lot and grade
  // as the site file comes in, then the foundation (piers and a stem wall, or a slab on grade, after the Foundation pick,
  // live), the floor and walls (floor1), the roof (attic), the framing and the furniture, the water in blue and red, the
  // drain in white and the gas in yellow (the pipe files), then the equipment dropping in, one unit per model the house
  // places. The lights come on and the door opens at the moment Enter unlocks (isReady, unchanged); the pipes and the
  // equipment keep drawing after it, as the real house keeps loading behind you. Driven by real progress only, never a
  // timer: the shim's per file bytes (window.__loads.files, in start order) and walk.js's progress hook
  // (window.__walkProgress, round 98); an older walk.js without the hook gives the same picture from the file names.
  // The site file is the lot AND the ground the foundation sits in, so its first 55 percent draws the lot and the rest
  // the foundation; the tiny crawl or slab file (last of the four) finishes it. Every state is a CSS variable on #setup,
  // so the small copy beside the enter note on the House layout screen follows the same state.
  var HB = (function () {
    var S = setupEl.style, SIZES = null, from = 0, eqN = 0, eqT = 0, P0 = null, mini = null, still = false, hold = false;
    try { still = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    var STAGES = ['lot', 'fnd', 'wal', 'rof', 'frm', 'fur', 'sup', 'dwv', 'gas', 'hvc'];
    function stageOf(n) {
      if (/house_site/.test(n)) return 'site'; if (/house_floor1/.test(n)) return 'wal'; if (/house_attic/.test(n)) return 'rof';
      if (/house_(crawl|slab)\.glb$/.test(n)) return 'fnd'; if (/furniture|garagefurn/.test(n)) return 'fur'; if (/framing/.test(n)) return 'frm';
      if (/pipes_supply/.test(n)) return 'sup'; if (/pipes_dwv/.test(n)) return 'dwv'; if (/pipes_gas/.test(n)) return 'gas'; if (/pipes_hvac/.test(n)) return 'hvc';
      if (/pipes_alternates|gloves|needle_nose|clamp_meter|multimeter/.test(n)) return null;
      return 'eq';     // a placed model
    }
    // how far along one file is: done, or its bytes against what the server (or assets.json, for a gzipped reply) says it weighs
    function frac(r) { if (r.done) return 1; var t = r.total || (SIZES && SIZES[r.name]) || 0; return t ? Math.min(1, r.loaded / t) : 0; }
    function update() {

        var A = window.__ASSETS || {};
        if (!S.part && A['placements.json'] && A['info.json']) Promise.all([text(A['placements.json']), text(A['info.json'])]).then(function (r) {
          var pl = (JSON.parse(r[0]).packs || JSON.parse(r[0]).placements || []).filter(function (x) { return x.model === S.model && (!S.socket || x.socket === S.socket); })[0];
          var nm = pl && pl.pack && JSON.parse(r[1]).packs[pl.pack] && JSON.parse(r[1]).packs[pl.pack].name;
          if (nm && setupEl.style.display !== 'none') say('Finding the ' + nm.replace(/\s*\(.*\)$/, '').toLowerCase() + '...');
        }).catch(function () {});
      } catch (e) {}
      var tries = 0;
      (function find() {
        var u = null;
        W.equip.children.forEach(function (c) { if (c.userData.model === S.model && (!S.socket || c.userData.socket === S.socket)) u = c; });
        if (!u) {
          if (!sk && tries === 12 && W.loadAll) W.loadAll();     // no socket to stand beside: after 3 s fetch the rest
          if (++tries < 480) return setTimeout(find, 250);      // two minutes on a slow phone, then the house as it is
          return done();
        }
        // the tick it is placed its world box is still empty and goToUnit has nothing to frame: it says so with null, so ask again
        var went = W.goToUnit(u);
        if (!went) { if (++tries < 480) return setTimeout(find, 250); return done(); }
        // nowhere to stand in front of it (the Flo over the attic joists: no floor within reach): show it in elevation instead of
        // leaving the person on the floor below staring at a ceiling
        if (/^no clear place/.test(went) && S.view === 'unit') S.view = 'elevation';
        // once the glide to the unit has ended (it moves you every frame, and would move you out of the elevation's pose)
        var waits = 0;
        (function settle() {
          if (W.gliding && W.gliding() && ++waits < 130) return setTimeout(settle, 150);     // a throttled tab draws few frames and glides slowly
          openDoorTo(u);
          if (S.view === 'elevation') { try { W.elevation(u); } catch (e) { console.warn(e); } return done(); }
          if (S.view !== 'part' || !S.part) return done();     // the unit view: standing in front of it, its door open
          var part = null;
          u.traverse(function (o) { if (!part && o.isMesh && o.visible && W.nodeName(o) === S.part) part = o; });
          if (!part) { console.warn('show: no visible part called ' + S.part + ' on ' + S.model); return done(); }
          try { W.viewPart(part); W.openPanel(part); } catch (e) { console.warn(e); }
          done();
        })();
      })();
    } catch (e) { console.warn(e); done(); }
  }
  // Round 87 (Jake, the furnace link landed on the closed closet door): walk.js's own rule stands you on the hall floor facing a
  // closed closet and leaves the door to you. For a link, the door between where you stand and the unit is opened.
  function openDoorTo(u) {
    var W = window.walk; if (!W.doors || !W.toggleDoor || !W.pos || !W.where) return;
    try {
      // the door you are facing: walk.js stands you square to a closet and its unit's box (ducts and all) is no guide to where the
      // door is, so the nearest closed door inside 2 m and within about 45 degrees of where you look is the one
      var p = W.pos, yaw = W.where().yaw, lx = -Math.sin(yaw), lz = -Math.cos(yaw), best = null;
      W.doors.forEach(function (d) {
        if (d.userData.open || d.userData.garage) return;
        var bc = new THREE.Box3().setFromObject(d).getCenter(new THREE.Vector3()); if (Math.abs(bc.y - p.y) > 2.2) return;
        var vx = bc.x - p.x, vz = bc.z - p.z, dist = Math.hypot(vx, vz); if (dist < 0.05 || dist > 2.0) return;
        if ((vx * lx + vz * lz) / dist < 0.7) return;
        if (!best || dist < best.dist) best = { d: d, dist: dist };
      });
      if (best) W.toggleDoor(best.d);
    } catch (e) { console.warn(e); }
  }
  // view 'layer': the gas line or the ductwork card. No unit: x-ray on, only that layer and the equipment showing, at the door.
  function showLayer(layer) {
    var x = document.getElementById('xray'); if (x && !x.classList.contains('on')) x.click();
    document.querySelectorAll('[data-layer]').forEach(function (c) {
      var keep = c.dataset.layer === 'equipment' || c.dataset.layer === layer;
      if (c.checked !== keep) { c.checked = keep; if (c.onchange) c.onchange(); }
    });
  }

  // Sideways. Called straight from the Enter tap, because a browser only allows full screen and an orientation lock from a
  // person's own gesture. Android Chrome does both. An iPhone does neither from a web page, and nothing here throws: the
  // "Turn your phone sideways" screen above covers that case. A desktop has no touch screen and is left alone.
  function lockLandscape() {
    if (!('ontouchstart' in window)) return;
    try {
      var el = document.documentElement, fs = el.requestFullscreen || el.webkitRequestFullscreen;
      var p = fs ? fs.call(el) : null;
      var lock = function () { try { var o = screen.orientation; if (o && o.lock) o.lock('landscape').catch(function () {}); } catch (e) {} };
      if (p && p.then) p.then(lock, lock); else lock();
    } catch (e) { /* not allowed here: the rotate screen still asks */ }
  }

  // ------------------------------------------------------------------ the gloved hands
  // They were in the app's old engine; the walk page never had them. Built in camera space already posed
  // (hand_tools/scripts/build_gloves.py), so they hang on the camera at the origin. Off whenever the walk page puts
  // something else in your hands or takes you out of your own eyes: a meter, the pliers, a held part, the ball.
  function addGloves() {
    var W = window.walk;
    if (!window.__ASSETS['gloves.glb'] || !W.camera) return;
    // this loader is the shell's own, not walk.js's, so it needs the decoder handed to it as well: without it the compressed
    // gloves.glb failed without a word and there were no hands at all (caught in the phone test, round 60)
    var GL = new THREE.GLTFLoader(); if (window.MeshoptDecoder && GL.setMeshoptDecoder) GL.setMeshoptDecoder(window.MeshoptDecoder);
    GL.load('gloves.glb', function (g) {
      var hands = g.scene;
      hands.traverse(function (o) { if (o.isMesh) { o.frustumCulled = false; o.renderOrder = 10; } });
      W.camera.add(hands);
      if (!W.camera.parent) W.scene.add(W.camera);
      // Round 60 (Jake, on his phone: "I can barely see the gloves"). They were posed for a wide window: 17 cm either side of
      // centre, fingertips about 44 cm out. A phone held upright sees only 14 cm to each side at that distance, so all that
      // showed was a 3 cm sliver of each hand. They are fitted to the shape of the screen now: on a narrow one they come in
      // toward the middle and move a little further off, which makes them smaller, so both fit side by side. On a wide
      // screen (anything over about 0.7 wide to 1 tall) they sit exactly where they were built.
      var L = hands.getObjectByName('glove_left'), R = hands.getObjectByName('glove_right');
      if (L && R) {
        var base = { x: Math.abs(R.position.x), y: R.position.y, z: R.position.z }, lastA = 0;
        var fit = function () {
          var a = W.camera.aspect; if (!(a > 0) || Math.abs(a - lastA) < 0.01) return; lastA = a;
          var k = Math.tan((W.camera.fov || 70) * Math.PI / 360) * 0.34;     // half the view's height at the middle of the hand
          var m = Math.max(1, Math.min(1.8, 0.165 / (k * a)));              // further off until 16.5 cm of half width is in view
          var x = Math.max(0.07, Math.min(base.x * m, 0.5 * k * m * a));
          L.position.set(-x, base.y * m, base.z * m); R.position.set(x, base.y * m, base.z * m);
        };
        fit(); window.addEventListener('resize', fit); setInterval(fit, 700);
      }
      var busy = function () {
        try { return !!(W.held() || W.meter() || W.pliers() || W.ball()); } catch (e) { return false; }
      };
      (function loop() { hands.visible = !busy(); requestAnimationFrame(loop); })();
    }, undefined, function () { /* no gloves uploaded: carry on without them */ });
  }

  // ------------------------------------------------------------------ phone controls
  // The walk page reads keys off the document and looks by dragging the mouse on its canvas, deciding a click on mouse
  // up if the pointer barely moved. So the stick presses W A S D (and Shift when pushed to the rim), and a finger on the
  // view is turned into the same mouse down, move and up the walk page already understands. A tap is therefore a click.
  // ------------------------------------------------------------------------------------------ the eye height slider
  // Round 60, Jake on his phone: "we need a crouch button, like an adjustable one... a slider over to the side. All the way up is
  // standing, all the way down is crawling. They can adjust that position all they want to."
  // The walk page has only a Crouch button a phone cannot hold down, so the height comes from here. It drives walk.js's own
  // setEye(), which sets the stance with the height (at the bottom you really are crawling: short step, half pace, through the
  // crawl door), and it follows the walk page when the height changes some other way (the C key, or being taken to a unit).
  // Pointer events, so a mouse works it the same as a thumb. An older walk.js has no setEye and then there is no slider.
  function addEyeSlider() {
    var W = window.walk; if (!W || !W.setEye || document.getElementById('eyebar')) return;
    var lo = W.eyeRange[0], hi = W.eyeRange[1];
    var bar = document.createElement('div'); bar.id = 'eyebar';
    bar.innerHTML = '<div class="end top">Stand</div><div class="track"><div class="fill"></div></div><div class="thumb"></div><div class="end bot">Crawl</div>';
    document.body.appendChild(bar);
    var track = bar.querySelector('.track'), fill = bar.querySelector('.fill'), thumb = bar.querySelector('.thumb'), dragging = false;
    function show(h) {
      var t = Math.max(0, Math.min(1, (h - lo) / (hi - lo))), r = track.getBoundingClientRect(), b = bar.getBoundingClientRect();
      thumb.style.top = (r.top - b.top + (1 - t) * r.height) + 'px'; fill.style.height = (t * 100) + '%';
      thumb.textContent = Math.round(h * 39.37) + '"';
    }
    function fromPointer(e) {
      var r = track.getBoundingClientRect(), t = 1 - (e.clientY - r.top) / r.height;
      t = Math.max(0, Math.min(1, t)); if (t > 0.96) t = 1;     // the top few percent is simply standing
      show(W.setEye(lo + t * (hi - lo)));
    }
    bar.addEventListener('pointerdown', function (e) { e.preventDefault(); dragging = true; try { bar.setPointerCapture(e.pointerId); } catch (x) {} fromPointer(e); });
    bar.addEventListener('pointermove', function (e) { if (dragging) { e.preventDefault(); fromPointer(e); } });
    function end() { dragging = false; }
    bar.addEventListener('pointerup', end); bar.addEventListener('pointercancel', end);
    show(W.eyeWanted());
    setInterval(function () { if (!dragging) show(W.eyeWanted()); }, 250);
  }

  function addTouch() {
    if (!('ontouchstart' in window)) return;
    var stick = document.createElement('div'); stick.id = 'stick';
    var knob = document.createElement('div'); knob.id = 'knob'; stick.appendChild(knob);
    var lf = document.createElement('span'); lf.className = 'f'; lf.textContent = 'Forward'; stick.appendChild(lf);
    var lb = document.createElement('span'); lb.className = 'b'; lb.textContent = 'Back'; stick.appendChild(lb);
    document.body.appendChild(stick);
    var held = {};
    function key(code, on) {
      if (!!held[code] === on) return;
      held[code] = on;
      document.dispatchEvent(new KeyboardEvent(on ? 'keydown' : 'keyup', { code: code, key: code, bubbles: true }));
    }
    var sid = null, cx = 0, cy = 0, R = 46;
    // up and down only: sideways movement of the thumb is ignored, so a thumb that wanders does not steer you
    function setStick(dx, dy) {
      dy = Math.max(-R, Math.min(R, dy));
      knob.style.transform = 'translate(0px,' + dy + 'px)';
      var y = dy / R;
      key('KeyW', y < -0.25); key('KeyS', y > 0.25);
      key('ShiftLeft', Math.abs(y) > 0.9);
      if (window.walk && window.walk.setTurn) window.walk.setTurn(0);
    }
    stick.addEventListener('touchstart', function (e) {
      e.preventDefault();
      var t = e.changedTouches[0], r = stick.getBoundingClientRect();
      sid = t.identifier; cx = r.left + r.width / 2; cy = r.top + r.height / 2;
      setStick(t.clientX - cx, t.clientY - cy);
    }, { passive: false });
    stick.addEventListener('touchmove', function (e) {
      e.preventDefault();
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (t.identifier === sid) setStick(t.clientX - cx, t.clientY - cy);
      }
    }, { passive: false });
    function stickEnd(e) {
      for (var i = 0; i < e.changedTouches.length; i++) if (e.changedTouches[i].identifier === sid) { sid = null; setStick(0, 0); }
    }
    stick.addEventListener('touchend', stickEnd);
    stick.addEventListener('touchcancel', stickEnd);

    var canvas = document.querySelector('canvas');
    if (!canvas) return;
    // a finger travels a shorter way across a phone than a mouse does across a desk, so a drag turns the view further here
    if (window.walk && window.walk.setLookScale) window.walk.setLookScale(1.6);
    var lid = null;
    function mouse(type, t, target) {
      (target || document).dispatchEvent(new MouseEvent(type, {
        clientX: t.clientX, clientY: t.clientY, button: 0, buttons: type === 'mouseup' ? 0 : 1, bubbles: true, cancelable: true,
      }));
    }
    // Two fingers pinch to zoom (Jake: "we don't need zoom, that's ridiculous, we need a two pinch zoom"). Spreading the fingers
    // narrows the walk page's field of view through its own setFov, which keeps it between a long lens and the normal view;
    // pinching back in returns to normal. The first finger was already looking round, so when the second one lands that drag
    // is ended WITHOUT a click and without a turn (a nudge out and back marks it as a drag, then it is let go), and nothing
    // looks or clicks again until every finger is off the glass.
    // targetTouches, not touches: only fingers on the VIEW count, so a thumb holding the walk slider is never half of a pinch
    var lpos = null, pinch = null;
    function span(a, b) { return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
    canvas.addEventListener('touchstart', function (e) {
      e.preventDefault();
      var W = window.walk;
      if (lid !== null || pinch) {
        if (!pinch && W && W.setFov && e.targetTouches.length >= 2) {
          if (lpos) { mouse('mousemove', { clientX: lpos.clientX + 8, clientY: lpos.clientY }); mouse('mousemove', lpos); mouse('mouseup', lpos, document); }
          pinch = { d0: Math.max(20, span(e.targetTouches[0], e.targetTouches[1])), f0: W.camera.fov };
        }
        return;
      }
      var t = e.changedTouches[0]; lid = t.identifier; lpos = { clientX: t.clientX, clientY: t.clientY };
      mouse('mousedown', t, canvas);
    }, { passive: false });
    canvas.addEventListener('touchmove', function (e) {
      e.preventDefault();
      if (pinch) { if (e.targetTouches.length >= 2) window.walk.setFov(pinch.f0 * pinch.d0 / Math.max(20, span(e.targetTouches[0], e.targetTouches[1]))); return; }
      for (var i = 0; i < e.changedTouches.length; i++) if (e.changedTouches[i].identifier === lid) { lpos = { clientX: e.changedTouches[i].clientX, clientY: e.changedTouches[i].clientY }; mouse('mousemove', e.changedTouches[i]); }
    }, { passive: false });
    function lookEnd(e) {
      if (pinch) { if (e.targetTouches.length === 0) { pinch = null; lid = null; lpos = null; } return; }
      for (var i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier !== lid) continue;
        lid = null;
        // dispatched on the canvas so the walk page sees its own canvas as the target, which is what makes it a click
        mouse('mouseup', e.changedTouches[i], canvas);
      }
    }
    canvas.addEventListener('touchend', lookEnd);
    canvas.addEventListener('touchcancel', lookEnd);
  }
})();
</script>
</body>
</html>
